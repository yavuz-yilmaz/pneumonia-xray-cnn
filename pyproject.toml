[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia-xray-cnn"
version = "0.1.0"
description = "CNN ile akciğer röntgenlerinden zatürre tespiti için Python projesi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pneumonia X-Ray CNN Contributors" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "numpy>=1.26.0,<2.3.0",
    "opencv-python>=4.10.0,<5.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pillow>=10.4.0,<12.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "streamlit>=1.37.0,<2.0.0",
    "torch>=2.4.0,<3.0.0",
    "torchvision>=0.19.0,<1.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "app", "scripts", "tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "data",
    "models",
    "reports"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "ANN",
    "S",
    "C4",
    "SIM"
]
ignore = [
    "S101"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "^data/",
    "^models/",
    "^reports/"
]
